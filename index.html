<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tiko legal documents">
  <title>Tiko Legal</title>
  <style>
    :root {
      --background: #1A1714;
      --border: #3A342C;
      --primary: #CD8A6E;
      --accent: #C8A54D;
      --text: #E8E0D5;
      --muted: #9E958A;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(560px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18vh 0;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 2.35rem;
      font-weight: 650;
      line-height: 1.3;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
    }

    nav {
      display: grid;
      gap: 12px;
    }

    a {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body>
  <main>
    <h1>Tiko</h1>
    <p>Terms and privacy information for the Tiko Discord bot.</p>
    <nav aria-label="Legal documents">
      <a href="terms.html">Terms of Use</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="https://discord.gg/cVeZ8qwQ8F">Join the Tiko Discord Server</a>
    </nav>
  </main>
</body>
</html>
